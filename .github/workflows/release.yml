name: Zyr Git release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate version and build
        shell: pwsh
        run: |
          $releaseVersion = '${{ github.ref_name }}'.TrimStart('v')
          $projectVersion = (Get-Content VERSION -Raw).Trim()
          if ($releaseVersion -ne $projectVersion) {
            throw "Tag $releaseVersion does not match VERSION $projectVersion"
          }
          .\scripts\build.ps1 -Version $releaseVersion
      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            dist/ZyrGit-Setup.exe dist/SHA256SUMS.txt `
            --repo '${{ github.repository }}' `
            --verify-tag `
            --title 'Zyr Git ${{ github.ref_name }}' `
            --generate-notes
